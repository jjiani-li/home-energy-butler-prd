<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沃太家庭能源管家 Butler · 原型</title>
<meta name="description" content="沃太家庭能源管家 Butler 交互原型：12 个页面、单文件、模拟数据。">
<style>
/* ============================================================
   设计系统 · Minimalism / Swiss Style
   黑 + 白 + 中性灰为主体，仅 1 个强调色（管家正在为你工作）
   红 / 琥珀只用于语义告警 · 圆角 0–2px · 1px 实线分层 · 不使用投影与渐变
   图标统一 20x20 / 1.5px 线宽 / 无填充 · 全文禁用 emoji
   ============================================================ */
:root{
  --paper:#F5F5F3;
  --surface:#FFFFFF;
  --sunk:#EDEDEA;
  --sunk-2:#E6E6E2;

  --ink:#0E1116;        /* 16.9:1 on paper */
  --ink-2:#4B5563;      /* 7.5:1  */
  --ink-3:#6B7280;      /* 4.8:1  */
  --ink-4:#9AA0A6;      /* 仅用于图形与分隔，不用于正文 */

  --line:#E3E4E6;
  --line-2:#C9CBCF;
  --line-3:#9AA0A6;

  --accent:#1D4ED8;     /* 6.3:1 on surface —— 唯一强调色 */
  --accent-2:#1E40AF;
  --accent-weak:#EEF2FE;

  --warn:#B45309;       /* 4.9:1 */
  --warn-weak:#FBF4E9;
  --danger:#B42318;     /* 6.4:1 */
  --danger-weak:#FBEDEB;
  --ok:#15803D;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
         "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  --r:2px;
  --r2:4px;

  --z-base:0; --z-sticky:20; --z-rail:30; --z-drawer:50; --z-modal:70; --z-toast:90;
  --sidebar-w:236px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  font-size:15px;
  line-height:1.6;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.35}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
[tabindex="-1"]:focus{outline:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-48px;z-index:var(--z-modal);background:var(--surface);
  border:1px solid var(--line-2);padding:8px 12px;transition:top .15s ease-out}
.skip:focus{top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 骨架 ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100dvh}
.sidebar{
  position:sticky;top:0;height:100dvh;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:var(--z-rail);
}
.brand{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand-mark{width:20px;height:20px;flex:0 0 auto;color:var(--accent)}
.brand-text{font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand-ver{margin-left:auto;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.nav{flex:1 1 auto;overflow-y:auto;padding:12px 0}
.nav-group{padding:0 0 14px}
.nav-title{font-size:11px;letter-spacing:.06em;color:var(--ink-3);padding:0 16px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:8px 16px 8px 14px;border-left:2px solid transparent;color:var(--ink-2);
  font-size:14px;transition:color .15s ease-out,background-color .15s ease-out;
}
.nav-item:hover{background:var(--sunk);color:var(--ink)}
.nav-item.on{border-left-color:var(--accent);color:var(--accent);font-weight:500}
.nav-item.on .ico{color:var(--accent)}
.nav-item .ico{color:var(--ink-3);flex:0 0 auto}
.nav-item .badge{margin-left:auto}
.nav-item.attn{border-left-color:var(--warn)}
.nav-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 12px}
.role-switch{display:flex;flex-direction:column;gap:2px}
.role-btn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:7px 6px;font-size:13px;color:var(--ink-2);text-align:left}
.role-btn .dot{width:6px;height:6px;border:1px solid var(--line-3);border-radius:50%;flex:0 0 auto}
.role-btn.on{color:var(--ink);font-weight:500}
.role-btn.on .dot{background:var(--accent);border-color:var(--accent)}
.role-btn:hover{background:var(--sunk)}
.nav-foot .fine{font-size:11px;color:var(--ink-3);padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:6px}

/* ---------- 顶栏 ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:var(--z-sticky);height:56px;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;
}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0;flex:0 1 auto}
.crumbs .sep{color:var(--ink-4)}
.crumbs .cur{color:var(--ink);font-weight:500}
.crumbs .prev{color:var(--ink-3)}
.crumbs .app-name{font-size:13px;font-weight:600;letter-spacing:.02em}
.modebar{
  display:flex;align-items:center;gap:10px;height:32px;padding:0 10px 0 0;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r);min-width:220px;max-width:460px;
  text-align:left;overflow:hidden;
}
.modebar:hover{border-color:var(--ink-3)}
.modebar .chip{width:8px;height:100%;background:var(--line-3);flex:0 0 auto}
.modebar.s-shadow .chip{background:var(--ink-4)}
.modebar.s-advisory .chip{background:var(--ink-2);outline:1px dashed var(--ink-2);outline-offset:-3px}
.modebar.s-auto .chip{background:var(--accent)}
.modebar.s-conservative .chip{background:var(--warn)}
.modebar.s-safe .chip{background:var(--danger)}
.modebar.s-manual-hold .chip{background:var(--danger)}
.modebar .name{font-size:13px;font-weight:500;white-space:nowrap}
.modebar .why{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.freshness{font-size:12px;color:var(--ink-3);white-space:nowrap;background:none;border:0;padding:4px 2px}
.freshness:hover{color:var(--ink);text-decoration:underline}
.freshness.stale{color:var(--warn)}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  background:none;border:1px solid transparent;border-radius:var(--r);color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk);border-color:var(--line);color:var(--ink)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:38px;min-width:250px;background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r);padding:4px;z-index:var(--z-drawer);display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;
  font-size:13px;border-radius:var(--r)}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .k{font-size:11px;color:var(--ink-3);padding:6px 10px 4px;letter-spacing:.04em}
.menu .danger{color:var(--danger)}
.proto{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);
  border:1px dashed var(--line-2);border-radius:var(--r);padding:3px 8px;white-space:nowrap}
.proto b{color:var(--ink-2);font-weight:500}

/* ---------- 内容 ---------- */
.content{flex:1 1 auto;padding:24px 28px 72px;max-width:1240px;width:100%}
.page-head{margin-bottom:20px}
.page-head h1{font-size:26px;letter-spacing:-.01em;font-weight:600}
.page-head .sub{margin-top:6px;font-size:14px;color:var(--ink-2);max-width:640px}
.page-head .row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .row .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb-time{font-size:12px;color:var(--ink-3);margin-top:8px}

.banner{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-2);
  border-left:4px solid var(--warn);background:var(--warn-weak);padding:11px 14px;
  border-radius:var(--r);margin-bottom:16px}
.banner.safe,.banner.manual{border-left-color:var(--danger);background:var(--danger-weak)}
.banner.info{border-left-color:var(--accent);background:var(--accent-weak)}
.banner.neutral{border-left-color:var(--line-3);background:var(--sunk)}
.banner .bt{font-size:13px;font-weight:500}
.banner .bd{font-size:13px;color:var(--ink-2);margin-top:2px}
.banner .ba{margin-left:auto;flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.banner .cond{font-size:11px;color:var(--ink-3);text-align:right}

/* 卡片 / 网格 */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.pad0{padding:0}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-head h2{font-size:14px;font-weight:600}
.card-head .meta{margin-left:auto;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:10px}
.card-head .meta button{background:none;border:0;font-size:11px;color:var(--ink-3);padding:2px 0}
.card-head .meta button:hover{color:var(--accent);text-decoration:underline}
.card-note{font-size:12px;color:var(--ink-3);margin-top:8px}
.sec{margin-bottom:20px}
.sec > .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec > .sec-head h2{font-size:15px}
.sec > .sec-head .meta{margin-left:auto;font-size:11px;color:var(--ink-3)}
.c3{grid-column:span 4}.c4{grid-column:span 3}.c6{grid-column:span 6}
.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1200px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c8,.c9{grid-column:span 12}}

/* 结论卡 */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  display:block;text-align:left;width:100%;transition:border-color .15s ease-out}
button.stat:hover{border-color:var(--ink-3)}
.stat .k{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.stat .v small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:2px}
.stat .d{font-size:12px;color:var(--ink-2);margin-top:6px}
.stat .d.warn{color:var(--warn)}
.stat .d.good{color:var(--ok)}
.stat.alert{border-left:3px solid var(--warn)}

/* 徽标 */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1;padding:4px 7px;
  border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.badge.acc{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.badge.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-weak)}
.badge.danger{border-color:var(--danger);color:var(--danger);background:var(--danger-weak)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.ghost{background:var(--sunk);border-color:var(--line)}
.badge .dotm{width:5px;height:5px;border-radius:50%;background:currentColor}

/* 按钮 */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:7px 14px;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:13px;
  color:var(--ink);transition:background-color .15s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--sunk);border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-weak)}
.btn.sm{min-height:28px;padding:4px 10px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--ink-2);padding:6px 8px}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--surface);border-color:var(--line-2)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;flex:0 0 auto;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--surface);border:0;border-right:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sunk);color:var(--ink);font-weight:500}
.seg button:hover{color:var(--ink)}

/* 表格 */
.tbl{font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.04em;color:var(--ink-3);
  padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.clickable:hover{background:var(--sunk)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl .r{text-align:right}
.tbl .nowrap{white-space:nowrap}
.tbl caption{text-align:left;font-size:12px;color:var(--ink-3);padding:0 12px 8px}
.tbl-wrap{overflow-x:auto}
.tbl-wrap table{min-width:560px}
.pos{color:var(--ok)}
.neg{color:var(--danger)}
.dim{color:var(--ink-3)}
.tiny{font-size:11px}
.strong{font-weight:500}
.mono{font-family:var(--mono);font-size:12px}

/* 列表 */
.list{border-top:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:var(--sunk)}
.row .t{font-size:12px;color:var(--ink-3);white-space:nowrap;min-width:96px}
.row .b{flex:1 1 auto;min-width:0}
.row .b .h{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .b .p{font-size:12px;color:var(--ink-2);margin-top:3px}
.row .e{flex:0 0 auto;text-align:right}
.row .e .v{font-size:13px;font-weight:500}
.row .e .m{font-size:11px;color:var(--ink-3)}

/* 定义列表 */
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.dl dt{color:var(--ink-3)}
.dl dd{margin:0;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3)}
.kv .v{font-weight:500;text-align:right}

/* 深水区 */
details.deep{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:12px}
details.deep > summary{cursor:pointer;padding:10px 14px;font-size:12px;color:var(--ink-2);list-style:none;
  display:flex;align-items:center;gap:8px}
details.deep > summary::-webkit-details-marker{display:none}
details.deep > summary::before{content:"";width:12px;height:12px;flex:0 0 auto;
  background:
    linear-gradient(currentColor,currentColor) center/12px 1.5px no-repeat,
    linear-gradient(currentColor,currentColor) center/1.5px 12px no-repeat;}
details.deep[open] > summary::before{
  background:linear-gradient(currentColor,currentColor) center/12px 1.5px no-repeat}
details.deep > summary:hover{color:var(--ink)}
details.deep .deep-body{padding:2px 14px 14px;border-top:1px solid var(--line)}

/* 状态块（加载/空/降级/权限 共用） */
.stateblock{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px 24px;gap:10px}
.stateblock .ico{color:var(--ink-4)}
.stateblock h3{font-size:15px;font-weight:500}
.stateblock p{font-size:13px;color:var(--ink-3);max-width:420px}
.stateblock .btn{margin-top:6px}
.skel{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.skel i{display:block;background:var(--sunk);border-radius:var(--r)}
.skel .l1{height:32px}.skel .l2{height:24px}.skel .l2.w70{width:70%}
.skel .box120{height:120px}.skel .box64{height:64px}.skel .box200{height:200px}.skel .box240{height:240px}
.skel .rowline{height:32px}.skel .row48{height:48px}
.skel .hint{font-size:12px;color:var(--ink-3);text-align:center;padding-top:6px}

/* 时间线 */
.tl{position:relative;margin:4px 0 0;padding:0 0 0 18px;border-left:1px solid var(--line-2);list-style:none}
.tl li{position:relative;padding:0 0 16px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:-23px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line-3)}
.tl li.done::before{background:var(--ink-2);border-color:var(--ink-2)}
.tl li.now::before{background:var(--accent);border-color:var(--accent)}
.tl li.agent::before{border-color:var(--accent)}
.tl .tt{font-size:11px;color:var(--ink-3);letter-spacing:.02em}
.tl .th{font-size:13px;font-weight:500;margin-top:1px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .tp{font-size:12px;color:var(--ink-2);margin-top:2px}

/* 图表 */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .axis{stroke:var(--line-2);stroke-width:1}
.chart .gridline{stroke:var(--line);stroke-width:1}
.chart .lbl{font-size:10px;fill:var(--ink-3);font-family:var(--font)}
.chart .bar{fill:var(--sunk-2)}
.chart .bar.hot{fill:var(--accent)}
.chart .bar.warn{fill:var(--warn)}
.chart .line{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.chart .line.accent{stroke:var(--accent)}
.chart .line.dashed{stroke-dasharray:4 3;stroke:var(--ink-4)}
.chart .area{fill:var(--sunk);stroke:none}
.chart .band{fill:var(--accent-weak)}
.chart .band.warn{fill:var(--warn-weak)}
.chart .mk{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5}
.chart .mk.accent{stroke:var(--accent)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover + .band,.chart .hit:hover ~ .hl{fill:var(--sunk)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:8px;display:inline-block;border:1px solid var(--line-2);background:var(--surface)}
.legend i.b{background:var(--sunk-2);border-color:var(--line-2)}
.legend i.a{background:var(--accent);border-color:var(--accent)}
.legend i.w{background:var(--warn);border-color:var(--warn)}
.legend i.l{border:0;border-top:2px solid var(--ink-2);height:0}
.legend i.d{border:0;border-top:2px dashed var(--ink-4);height:0}

/* 能量流 */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.flow .node{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);
  text-align:left;display:block;width:100%}
.flow .node:hover{border-color:var(--ink-3)}
.flow .node .n{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.flow .node .p{font-size:22px;font-weight:600;margin-top:8px;letter-spacing:-.01em}
.flow .node .p small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:3px}
.flow .node .f{font-size:12px;color:var(--ink-2);margin-top:4px}
@media (max-width:768px){.flow{grid-template-columns:repeat(2,1fr)}}

/* 三条轨（计划图） */

/* ---------- 图表（单色阶 + 一个强调色；带坐标轴与单位） ---------- */
function chartPrice(prices,fee,opt){
  opt=opt||{};
  const W=720,H=opt.h||180,PADL=34,PADR=8,PADT=12,PADB=24;
  const totals=prices.map((p,i)=>p+fee[i]);
  const max=Math.max.apply(null,totals), min=Math.min(0,Math.min.apply(null,totals));
  const span=(max-min)||1, y0=H-PADB, yTop=PADT;
  const bw=(W-PADL-PADR)/24;
  const yOf=v=> y0-(v-min)/span*(y0-yTop);
  const zeroY=yOf(0);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="明日 24 小时合计电价柱状图，单位欧元每度，最低出现在 12 点，最高出现在 18 点">';
  for(let i=0;i<=4;i++){ const v=min+span*i/4, y=yOf(v);
    s+='<line class="gridline" x1="'+PADL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PADR)+'" y2="'+y.toFixed(1)+'" opacity=".7"/>'+
       '<text class="lbl" x="'+(PADL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+v.toFixed(2)+'</text>'; }
  if(min<0) s+='<line class="axis" x1="'+PADL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-PADR)+'" y2="'+zeroY.toFixed(1)+'"/>';
  prices.forEach((p,i)=>{
    const y=yOf(totals[i]), hgt=Math.max(1,Math.abs(y-zeroY));
    const top = totals[i]>=0? y : zeroY;
    const inWindow = opt.window && i>=opt.window[0] && i<opt.window[1];
    const cls = inWindow?'bar hot':(totals[i]<0.1?'bar warn':'bar');
    s+='<rect class="'+cls+'" x="'+(PADL+bw*i+1).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+(bw-2).toFixed(1)+'" height="'+hgt.toFixed(1)+'"/>';
  });
  s+='<line class="axis" x1="'+PADL+'" y1="'+y0+'" x2="'+(W-PADR)+'" y2="'+y0+'"/>';
  [0,6,12,18,23].forEach(i=>{ s+='<text class="lbl" x="'+(PADL+bw*i+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+String(i).padStart(2,'0')+':00</text>'; });
  s+='<text class="lbl" x="'+PADL+'" y="'+(PADT-2)+'" text-anchor="start">欧元 / 度（零售电价 + 输配电费）</text>';
  s+='</svg>';
  return s;
}

function chartLine(series,opt){

  if(opt.unit) s+='<text class="lbl" x="'+PADL+'" y="'+(PADT-2)+'">'+esc(opt.unit)+'</text>';

function socSeries(){
  const seg=[[0,38.0],[130,36.5],[280,78.0],[540,74.0],[700,71.0],[750,76.0],[960,88.0],[1020,92.0],
             [1104,62.4],[1140,60.0],[1260,52.0],[1425,48.0]];
  const out=[];
  for(let i=0;i<96;i++){
    const m=i*15;
    let a=seg[0],b=seg[1];
    for(let j=0;j<seg.length-1;j++){ if(m>=seg[j][0]&&m<=seg[j+1][0]){a=seg[j];b=seg[j+1];break;} a=seg[seg.length-2];b=seg[seg.length-1]; }
    const t=(b[0]===a[0])?0:(m-a[0])/(b[0]-a[0]);
    out.push({i:i,v:+(a[1]+(b[1]-a[1])*clamp(t,0,1)).toFixed(1)});
  }
  return out;
}

function parseHash(){
  const raw=location.hash.replace(/^#\/?/,'');
  const parts=raw.split('#');
  const seg=parts[0].split('/').filter(Boolean);
  return {route:seg[0]||'today', param:seg[1]?decodeURIComponent(seg[1]):null, anchor:parts[1]||null};
}
function go(route,param,anchor){
  let h='#/'+route+(param?'/'+encodeURIComponent(param):'');
  if(anchor) h+='#'+anchor;
  if(location.hash===h) render(); else location.hash=h;
}
function render(){
  let p=parseHash();
  S.route=p.route; S.param=p.param; S.anchor=p.anchor;

  /* 引导守卫 */
  if(!S.onboarded && S.route!=='onboarding' && S.route!=='settings'){
    S.pendingRoute = S.route;
    S.route='onboarding'; S.param=null;
  }
  if(S.route==='onboarding') S.param=null;

  const DETAIL={decisions:'_decisionDetail',incidents:'_incidentsDetail'};
  const P=(S.param&&DETAIL[S.route]&&window.PAGES[DETAIL[S.route]])||window.PAGES[S.route];
  if(!P){ S.route='_404'; }

  renderNav(); renderTopbar();

  const main=document.getElementById('main');
  let body='';

  if(S.route==='_404'){
    body=stateBlock('denied','这个地址不存在','可能是链接过期了。你可以从下面的入口回到常用页面。',
      '<button class="btn" data-goto="today">回到今日</button>');
  }else if(S.pageState==='loading'){
    body=skeleton(S.route);
  }else if(S.pageState==='denied' || (ROLE_HINT[S.route] && S.role==='owner' && (S.route==='markets'||S.route==='installer'))){
    const d=P.denied||{title:'这件事只有业主本人能改',desc:'涉及停电备用和电池寿命，安装商不能代改。你可以发起一个申请，让业主一键确认。',action:'发起变更申请'};
    body=stateBlock('denied',d.title,d.desc,'<button class="btn" data-act="ask-owner">'+esc(d.action||'发起变更申请')+'</button>');
  }else if(S.pageState==='empty'){
    const e=P.empty||{title:'现在没有内容',desc:'换个时间再来看看。'};
    body=stateBlock('empty',e.title,e.desc,e.action?'<button class="btn" data-goto="'+e.action+'">'+esc(e.actionLabel||'去看看')+'</button>':'');
  }else{
    body=P.render();
    if(S.pageState==='degraded'){ body=staleNote()+degBanner()+body; }
    else body=degBanner()+body;
  }
  if(S.route!=='onboarding' && S.route!=='_404') body+=protoBar();
  main.innerHTML=body;

  const h1=document.getElementById('page-h1');
  if(h1 && document.activeElement!==document.getElementById('nav')) { try{h1.focus({preventScroll:true});}catch(e){} }
  if(S.anchor){ const a=document.getElementById(S.anchor); if(a) a.scrollIntoView({block:'start'}); }
  else window.scrollTo(0,0);
  document.getElementById('overflowMenu').classList.remove('open');
}

        '<button class="btn" data-act="onb-default">全部用默认值跳过</button></div>'+
        '<p class="card-note">你用不到任何百分比。备电时长、循环预算这些我会自动换算，改的时候用小时和次数。</p>')+'</section>';
    }
    if(step===1){
      const done=sh.days.filter(d=>d.followed).length;
      h+='<section class="sec">'+card(cardHead('影子期进度',
        '<span class="tiny dim">'+sh.startedAt+' 至 '+sh.endsAt+' · 共 '+sh.daysTotal+' 天</span>')+
        '<div class="bar lg"><i class="acc" style="width:'+pct(sh.daysDone/sh.daysTotal*100,0)+'"></i></div>'+
        '<div class="grid" style="margin-top:16px">'+
        '<div class="c4">'+kv('已过天数',sh.daysDone+' / '+sh.daysTotal)+'</div>'+
        '<div class="c4">'+kv('你照做了',done+' 天')+'</div>'+
        '<div class="c4">'+kv('如果全照做能省',eur(sh.ifFollowed))+'</div>'+
        '</div>'+
        '<p class="card-note">这段时间我只出建议，不执行任何动作。你一次都不用管我。</p>')+'</section>';
      h+='<section class="sec" id="compare">'+card(cardHead('建议 vs 实际')+
        table([{t:'日期'},{t:'我建议的'},{t:'实际发生的'},{t:'差多少',r:true}],
          sh.days.map(d=>({cells:['<span class="mono tiny">'+esc(d.d)+'</span>',esc(d.advice),
            d.followed?badge('照做了','ok'):badge('没执行','ghost'),
            '<span class="num '+(d.eur>0?'pos':'dim')+'">'+(d.eur?eur(d.eur,{sign:true}):'—')+'</span>']}))))+'</section>';
    }
    if(step===2){
      h+='<section class="sec" id="enable">'+card(cardHead('影子期的结论')+
        '<div class="grid">'+
        '<div class="c4"><span class="k tiny dim">如果全照我说的做</span><div class="num" style="font-size:26px">'+eur(sh.ifFollowed)+'</div></div>'+
        '<div class="c4"><span class="k tiny dim">比出厂策略多</span><div class="num" style="font-size:26px">'+eur(sh.delta)+'</div></div>'+
        '<div class="c4"><span class="k tiny dim">你有 4 天没执行</span><div class="num" style="font-size:26px">4<small>天</small></div></div>'+
        '</div>'+
        '<p class="card-note">这 14 天如果按我说的做，你大约省了 '+eur(sh.ifFollowed)+
        '。这 4 天没执行的原因我记下了：两次半夜不想被吵，两次白天家里没人。</p>'+
        '<div class="btn-row" style="margin-top:16px">'+
        '<button class="btn primary" data-act="enable-auto">现在就开始自动</button>'+
        '<button class="btn" data-act="defer-auto">再观察一段时间</button></div>'+
        '<p class="card-note tiny">开始自动后，涉及你家红线的动作我仍然会先问你。</p>')+'</section>';
    }
    return h;
  }
};

let lastFocus=null;
function openDrawer(title,body,foot){
  lastFocus=document.activeElement;
  const d=document.getElementById('drawer');
  d.innerHTML='<div class="dhead"><h3>'+esc(title)+'</h3>'+
    '<button class="icon-btn" style="margin-left:auto" data-act="close-drawer" aria-label="关闭">'+
    '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l10 10M15 5L5 15"/></svg></button></div>'+
    '<div class="dbody">'+body+'</div>'+(foot?'<div class="dfoot">'+foot+'</div>':'');
  d.hidden=false; d.classList.add('open');
  document.getElementById('scrim').classList.add('open');
  const f=d.querySelector('button,input,[href]'); if(f) f.focus();
}
function closeDrawer(){
  const d=document.getElementById('drawer');
  d.classList.remove('open'); d.hidden=true;
  document.getElementById('scrim').classList.remove('open');
  if(lastFocus&&lastFocus.focus){ try{lastFocus.focus();}catch(e){} }
  lastFocus=null;
}
function openFullpage(html){
  const f=document.getElementById('fullpage');
  f.innerHTML='<div class="fp-inner">'+html+'</div>';
  f.hidden=false; f.classList.add('open');
  document.body.style.overflow='hidden';
  const el=f.querySelector('input,button'); if(el) el.focus();
}
function closeFullpage(){
  const f=document.getElementById('fullpage');
  f.classList.remove('open'); f.hidden=true;
  document.body.style.overflow='';
}
let toastTimer=null;
function toast(msg,actionLabel,action){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+(actionLabel?'<button data-toast-act="1">'+esc(actionLabel)+'</button>':'');
  t.classList.add('open');
  if(action) t._act=action; else t._act=null;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('open'),5000);
}

      {k:'夜间静默',from:'23:00–07:00',to:'23:00–07:00（不变）',effect:'不变'},
      {k:'套利价差门槛',from:'€0.15 / 度',to:'€0.18 / 度',effect:'动手次数减少约 12%，每次更划算'},
      {k:'偏好配比',from:'省钱 40 / 备电 40 / 护电池 20',to:'省钱 35 / 备电 45 / 护电池 20',effect:'计划更保守，收益区间更窄'}
    ];
    render(); toast('这是新旧两版的差异，确认后才生效。','确认新版偏好',function(){
      SIM.settings.prefs={savings:35,backup:45,battery:20};
      SIM.review.status='done';
      go('collaborate',null,'audit');
      toast('新版偏好已生效并写进留痕。');
    });
  },
  'onb-answer':function(el){ S.onboardAnswers[+el.getAttribute('data-step')]=+el.getAttribute('data-idx'); render(); },
  'onb-submit':function(){ S.onboardStep=1; render(); toast('收到。换算成备电时长与循环预算我做好了，你用不到任何百分比。'); },
  'onb-default':function(){ S.onboardAnswers={0:1,1:1,2:0}; S.onboardStep=1; render(); toast('用了默认值：备电 4 小时、两边都顾、整夜静默。'); },
  'enable-auto':function(){ S.onboarded=true; S.mode='auto'; go('today'); toast('已开启自动模式。涉及你家红线的动作我仍然会先问你。'); },
  'defer-auto':function(){ S.onboarded=true; S.mode='advisory'; go('today'); toast('继续观察模式：我出建议，你自己决定。'); }
};
function curMarket(){ return SIM.markets.find(x=>x.id===S.param)||SIM.markets[0]; }

document.addEventListener('click',function(ev){
  const t=ev.target;
  const tt=t.closest('[data-toast-act]');
  if(tt){ const el=document.getElementById('toast'); if(el._act) el._act(); el.classList.remove('open'); return; }

  const role=t.closest('[data-role]');
  if(role){ S.role=role.getAttribute('data-role'); S.param=null; render(); return; }

  const modeBtn=t.closest('[data-mode]');
  if(modeBtn){ S.mode=modeBtn.getAttribute('data-mode'); render();
    toast('运行模式已切到"'+MODES[S.mode].name+'"。'); return; }

  const ps=t.closest('[data-state]');
  if(ps){ S.pageState=ps.getAttribute('data-state'); render(); return; }

  const stl=t.closest('[data-stale]');
  if(stl){ S.stale=stl.getAttribute('data-stale')==='1'; render(); return; }

  const onb=t.closest('[data-onb]');
  if(onb){ S.onboarded=onb.getAttribute('data-onb')==='1'; render(); return; }

  const fl=t.closest('[data-filter]');
  if(fl){ S.filters[fl.getAttribute('data-filter')]=fl.getAttribute('data-value'); render(); return; }

  const pv=t.closest('[data-planview]');
  if(pv){ S.planView=pv.getAttribute('data-planview'); render(); return; }

  const cv=t.closest('[data-curve]');
  if(cv){ S.houseCurve=cv.getAttribute('data-curve'); render(); return; }

  const rp=t.closest('[data-report]');
  if(rp){ S.reportPeriod=rp.getAttribute('data-report'); render(); return; }

  const tr=t.closest('[data-trend]');
  if(tr){ S.trendRange=tr.getAttribute('data-trend'); render(); return; }

  const os=t.closest('[data-onbstep]');
  if(os){ S.onboardStep=+os.getAttribute('data-onbstep'); render(); return; }

  const act=t.closest('[data-act]');
  if(act){
    const id=act.getAttribute('data-act');
    if(act.tagName==='INPUT'&&act.type==='radio'){ if(ACTS[id]) ACTS[id](act); }
    else { ev.preventDefault(); if(ACTS[id]) ACTS[id](act); }
    return;
  }
  const goto=t.closest('[data-goto]');
  if(goto){ ev.preventDefault(); go(goto.getAttribute('data-goto'),goto.getAttribute('data-param'),goto.getAttribute('data-anchor')); return; }

  if(t.id==='scrim') closeDrawer();
  if(!t.closest('#overflowBtn') && !t.closest('#overflowMenu'))
    document.getElementById('overflowMenu').classList.remove('open');
});
document.getElementById('overflowBtn').addEventListener('click',function(ev){
  ev.stopPropagation();
  const m=document.getElementById('overflowMenu');
  m.classList.toggle('open');
  this.setAttribute('aria-expanded',m.classList.contains('open'));
});
document.addEventListener('input',function(ev){
  const fr=ev.target.id==='fr-input';
  if(fr){ const ok=document.getElementById('fr-ok'); ok.disabled=(ev.target.value.trim()!=='出厂策略'); }
  const rg=ev.target.closest('[data-pref]');
  if(rg){
    const k=rg.getAttribute('data-pref');
    SIM.settings.prefs[k]=+rg.value;
    const vals=SIM.settings.prefs;
    rg.parentElement.querySelector('.v').textContent=rg.value;
  }
});
document.addEventListener('change',function(ev){
  const rg=ev.target.closest&&ev.target.closest('[data-pref]');
  if(rg){ render(); toast('偏好已更新：省钱 '+SIM.settings.prefs.savings+' / 备电 '+SIM.settings.prefs.backup+
    ' / 护电池 '+SIM.settings.prefs.battery+'。我会在下一份计划里体现。'); }
});
document.addEventListener('keydown',function(ev){
  const tag=(ev.target.tagName||'').toLowerCase();
  const typing = tag==='input'||tag==='textarea'||tag==='select';
  if(ev.key==='Escape'){
    if(document.getElementById('fullpage').classList.contains('open')) return closeFullpage();
    if(document.getElementById('drawer').classList.contains('open')) return closeDrawer();
    document.getElementById('overflowMenu').classList.remove('open');
    return;
  }
  if(document.getElementById('fullpage').classList.contains('open')) return;
  if(typing){ if(ev.key==='/') return; return; }
  if(gPending){
    const map={t:'today',p:'plan',d:'decisions',i:'incidents',h:'household',b:'battery',r:'reports',c:'collaborate',s:'settings'};
    gPending=false;
    if(map[ev.key]){ ev.preventDefault(); go(map[ev.key]); }
    return;
  }
  if(ev.key==='g'){ gPending=true; setTimeout(()=>{gPending=false;},1500); return; }
  if(ev.key==='?'){ ev.preventDefault(); openFullpage(shortcutsPage()); return; }
  if(ev.key==='/'){ const f=document.querySelector('input[type=search],.filters input'); if(f){ ev.preventDefault(); f.focus(); } }
});
let gPending=false;

/* ============================================================================
   10 · 启动
   ============================================================================ */
window.addEventListener('hashchange',render);
function init(){
  document.title='沃太家庭能源管家 Butler · 原型';
  if(!location.hash) location.hash='#/today';
  render();
}
init();
</script>
